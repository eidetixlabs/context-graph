name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r webserver/requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Secret scan
        run: ./scripts/secret-scan.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose up
        run: |
          echo "API_KEY=dev-local-key" > .env
          docker compose up --build -d
      - name: Smoke
        env:
          API_KEY: dev-local-key
        run: ./scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 200
      - name: Compose down
        if: always()
        run: docker compose down -v
